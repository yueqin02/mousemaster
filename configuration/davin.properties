# Davin's bindings: k/m/,/. movement (inverted-T), q/e click, hold shift = slow, f/v scroll.
# Enter mouse mode: hold leftalt (option), press c. Exit: esc or c.

# This runs at login, so the log must never become a keylog: info drops the
# per-keystroke lines, and redact-keys censors them even if the level is raised.
logging.level=INFO
logging.redact-keys=true

idle-mode.to.normal-mode=_{leftalt} +c
normal-mode.to.idle-mode=+esc | +c

# A green dot next to the cursor whenever mouse mode is on. Without it there is
# no way to tell that the keyboard is being grabbed.
normal-mode.indicator.enabled=true
normal-mode.indicator.idle.color=#00E676
normal-mode.indicator.move.color=#00E676
normal-mode.indicator.wheel.color=#00E676
normal-mode.indicator.mouse-press.color=#FF5252

normal-mode.mouse.initial-velocity=1000
normal-mode.mouse.max-velocity=2200 | _{leftshift} -> 250
normal-mode.mouse.acceleration=3000
normal-mode.mouse.acceleration-easing=smootherstep
normal-mode.mouse.deceleration=20

normal-mode.start-move.up=+k
normal-mode.stop-move.up=-k
normal-mode.start-move.left=+m
normal-mode.stop-move.left=-m
normal-mode.start-move.down=+,
normal-mode.stop-move.down=-,
normal-mode.start-move.right=+.
normal-mode.stop-move.right=-.

normal-mode.press.left=+q
normal-mode.release.left=-q
normal-mode.press.right=+e
normal-mode.release.right=-e

# History navigation: leftwin is the Command key on macOS, so these send the
# standard cmd-left / cmd-right back and forward shortcuts. Not cmd-[ / cmd-]:
# the us-qwerty layout has no bracket keys, so they cannot be injected.
normal-mode.macro.navigateforward=+w -> +leftwin +rightarrow -rightarrow -leftwin
normal-mode.macro.navigateback=+s -> +leftwin +leftarrow -leftarrow -leftwin

normal-mode.wheel.initial-velocity=1500
normal-mode.wheel.max-velocity=1000 | _{leftshift} -> 200
normal-mode.wheel.acceleration=500
normal-mode.start-wheel.up=+f
normal-mode.stop-wheel.up=-f
normal-mode.start-wheel.down=+v
normal-mode.stop-wheel.down=-v
normal-mode.start-wheel.left=+d
normal-mode.stop-wheel.left=-d
normal-mode.start-wheel.right=+g
normal-mode.stop-wheel.right=-g
