# Davin's bindings: WASD movement, q/e click, hold shift = slow, f/v scroll.
# Enter mouse mode: hold leftalt (option), press c. Exit: esc or c.

idle-mode.to.normal-mode=_{leftalt} +c
normal-mode.to.idle-mode=+esc | +c

normal-mode.mouse.initial-velocity=1000
normal-mode.mouse.max-velocity=2200 | _{leftshift} -> 250
normal-mode.mouse.acceleration=3000
normal-mode.mouse.acceleration-easing=smootherstep
normal-mode.mouse.deceleration=20

normal-mode.start-move.up=+w
normal-mode.stop-move.up=-w
normal-mode.start-move.left=+a
normal-mode.stop-move.left=-a
normal-mode.start-move.down=+s
normal-mode.stop-move.down=-s
normal-mode.start-move.right=+d
normal-mode.stop-move.right=-d

normal-mode.press.left=+q
normal-mode.release.left=-q
normal-mode.press.right=+e
normal-mode.release.right=-e

normal-mode.wheel.initial-velocity=1500
normal-mode.wheel.max-velocity=1000 | _{leftshift} -> 200
normal-mode.wheel.acceleration=500
normal-mode.start-wheel.up=+f
normal-mode.stop-wheel.up=-f
normal-mode.start-wheel.down=+v
normal-mode.stop-wheel.down=-v
